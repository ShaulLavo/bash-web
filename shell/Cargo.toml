[workspace]
members = ["parser", "engine", "compat-fixtures"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }

[profile.release]
# The browser guest is most of what a page downloads. "z" makes it ~12% smaller than "s"
# after brotli; fat LTO and wasm-opt both make the compressed guest larger.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
