[package]
name = "shell-compat-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Compatibility-instrument guests only: the frozen oracle's argv.py and printenv.py
# helpers as genuine programs on Waffle's process boundary. Never packaged.
[dependencies]
shell-engine = { path = "../engine" }
futures.workspace = true

[[bin]]
name = "argv-py"
path = "src/bin/argv.rs"

[[bin]]
name = "printenv-py"
path = "src/bin/printenv.rs"
