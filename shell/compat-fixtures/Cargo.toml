[package]
name = "shell-compat-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Compatibility-harness guests only: argv.py and printenv.py from the frozen oracle's
# helper directory, run as genuine programs on Waffle's process boundary, plus the
# native test bridge to Waffle's program families. Never packaged.
[dependencies]
shell-engine = { path = "../engine" }
waffle-program-support = { git = "https://github.com/ShaulLavo/waffle", rev = "4fa31792b6cfd1dcdc34404149572d571dfafd1b" }
waffle-coreutils = { git = "https://github.com/ShaulLavo/waffle", rev = "4fa31792b6cfd1dcdc34404149572d571dfafd1b" }
waffle-grep = { git = "https://github.com/ShaulLavo/waffle", rev = "4fa31792b6cfd1dcdc34404149572d571dfafd1b" }
futures.workspace = true
serde.workspace = true
serde_json = "1"

[[bin]]
name = "argv-py"
path = "src/bin/argv.rs"

[[bin]]
name = "printenv-py"
path = "src/bin/printenv.rs"

[[bin]]
name = "shell-cli"
path = "src/bin/shell-cli.rs"
