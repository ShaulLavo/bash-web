[package]
name = "shell-engine"
version = "0.0.30"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "shell-engine"

[features]
default = ["full"]
full = ["acceptance-utilities"]
lite = []
acceptance-utilities = ["dep:regex"]

[dependencies]
shell-parser = { path = "../parser" }
futures.workspace = true
pin-project-lite = "0.2.17"
regex = { optional = true, version = "1.12.2", default-features = false, features = [
  "std",
  "perf",
  "unicode",
] }

serde.workspace = true
serde_json = "1"

[[bin]]
name = "shell-runtime"
path = "src/runtime_main.rs"
