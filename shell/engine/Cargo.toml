[package]
name = "shell-engine"
version = "0.0.73"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "shell-engine"

[dependencies]
shell-parser = { path = "../parser" }
futures.workspace = true
waffle-program-support = { git = "https://github.com/ShaulLavo/waffle", rev = "557d0f2502ad2e2d2dd9042486e1b25c101cbcda", features = [
  "cooperative-wasi",
] }
pin-project-lite = "0.2.17"

serde.workspace = true
serde_json = "1"

[dependencies.unicode-properties]
version = "=0.1.3"
default-features = false
features = ["general-category"]

[[bin]]
name = "shell-runtime"
path = "src/runtime_main.rs"

[dev-dependencies]
waffle-program-support = { git = "https://github.com/ShaulLavo/waffle", rev = "557d0f2502ad2e2d2dd9042486e1b25c101cbcda", features = [
  "stack-observation",
] }
