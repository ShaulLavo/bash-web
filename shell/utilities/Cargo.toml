[package]
name = "shell-utilities"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shell-engine = { path = "../engine" }
futures.workspace = true
regex = { version = "1.12.2", default-features = false, features = ["std", "perf", "unicode"] }
uu_env = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_ls = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_head = "=0.12.0"
uu_sort = "=0.12.0"
uu_uniq = "=0.12.0"
uucore = "=0.12.0"
# uucore's WASI file-descriptor conversions require Rustix's std implementations.
rustix = { version = "1.1.5", features = ["std"] }

uu_touch = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_rm = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_cp = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_mv = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uucore_files = { package = "uucore", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }

[dev-dependencies]
serde_json = "1"

[package.metadata.cargo-machete]
# Upstream entries use uucore::bin!, which cargo-machete does not expand.
ignored = [
  "rustix",
  "uu_env",
  "uu_head",
  "uu_ls",
  "uu_sort",
  "uu_uniq",
  "uu_touch",
  "uu_rm",
  "uu_cp",
  "uu_mv",
]
