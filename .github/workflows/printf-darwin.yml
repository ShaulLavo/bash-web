name: Darwin printf quoting
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - shell/engine/**
      - shell/parser/**
      - shell/Cargo.toml
      - shell/Cargo.lock
      - .github/workflows/printf-darwin.yml
  push:
    branches: [main]
    paths:
      - shell/engine/**
      - shell/parser/**
      - shell/Cargo.toml
      - shell/Cargo.lock
      - .github/workflows/printf-darwin.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  printf-darwin:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .build/printf-darwin
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.98.1-aarch64-apple-darwin
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/printf-darwin
          cache-all-crates: true
          cache-workspace-crates: true
      - name: Confirm Darwin UTF-8 locale
        run: locale -a | grep -Fx en_US.UTF-8
      - name: Identify installed Bash control
        run: /bin/bash --version
      - name: Printf quoting from the initial C process locale
        run: cargo test --locked --manifest-path shell/Cargo.toml -p shell-engine --test words printf_quoting -- --test-threads=1 --show-output
