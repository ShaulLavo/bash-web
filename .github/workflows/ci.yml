name: Shell
run-name: ${{ inputs.main_source && format('Qualify main {0}', inputs.main_source) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      main_source:
        description: Full SHA of current main to qualify without changing its source
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: .build/shell
      WASI_LIBC_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: main-qualification-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Validate requested commit
        env:
          MAIN_SOURCE: ${{ inputs.main_source }}
        run: '[[ "$MAIN_SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_source }}
          path: .measured-main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact main source
        run: node scripts/scoreboard/shell-scoreboard-main-dispatch.ts prepare "$GITHUB_WORKSPACE/.measured-main" "$RUNNER_TEMP/main-score"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .measured-main/shell -> ../.build/shell
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: .measured-main/.build/wasi-libc
      - uses: ./.github/actions/wasi-sdk
      - name: Build unchanged main source
        working-directory: .measured-main
        run: |
          npm ci --ignore-scripts
          npm run build:worker
          npm run build:node-harness
          npm run build:shell
      - name: Observe unchanged main source
        working-directory: .measured-main
        run: npm run compat:shell:prebuilt
        env:
          BASH_COMPAT_JOBS: "4"
          BASH_COMPAT_SKIP_BUILD: "1"
          BASH_COMPAT_RECORD: "0"
          BASH_COMPAT_RAW: "1"
          BASH_COMPAT_OUT: ${{ runner.temp }}/main-score/score.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - name: Seal exact main raw score
        run: node scripts/scoreboard/shell-scoreboard-main-dispatch.ts seal "$GITHUB_WORKSPACE/.measured-main" "$RUNNER_TEMP/main-score"
      - name: Upload exact main raw score
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-main-raw-${{ inputs.main_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-score/raw.json
          retention-days: 90
          if-no-files-found: error
      - name: Fold exact main floor
        run: node scripts/scoreboard/shell-scoreboard-main-dispatch.ts fold "$GITHUB_WORKSPACE/.measured-main" "$RUNNER_TEMP/main-score"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload exact main floor
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-main-floor-${{ inputs.main_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-score/floor.json
          retention-days: 90
          if-no-files-found: error
  prepare:
    if: ${{ inputs.main_source == '' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
    env:
      CARGO_TARGET_DIR: .build/shell
      CARGO_BUILD_JOBS: "4"
      WASI_LIBC_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**/*.md'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - id: inputs
        run: node scripts/ci/ci-inputs.ts
      - uses: actions/cache@v4
        id: downloads
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node26.12.1-${{ steps.inputs.outputs.dependencies }}
          restore-keys: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node26.12.1-
      - uses: actions/cache@v4
        id: packages
        with:
          path: node_modules
          key: packages-${{ runner.os }}-${{ runner.arch }}-node26.12.1-${{ steps.inputs.outputs.dependencies }}
      - if: steps.packages.outputs.cache-hit != 'true' || steps.downloads.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - run: npm run sources:browser && npm run build:worker && npm run build:node-harness
      - name: Pack shared JavaScript inputs
        run: tar -I 'zstd -T0 -1' -cf "$RUNNER_TEMP/javascript.tar.zst" node_modules .sources .build/browser .build/node dist/shell-worker.js dist/fs-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-${{ github.sha }}
          path: ${{ runner.temp }}/javascript.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          workspaces: |
            shell -> ../.build/shell
            tests/guest -> ../../.build/test-guest
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: .build/wasi-libc
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          prefix-key: v0-rust-cli
          workspaces: shell -> ../.build/shell-cli
          cache-all-crates: true
          cache-workspace-crates: true
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          prefix-key: v0-wasi-tests
          workspaces: shell -> ../.build/shell-wasi-tests
          cache-all-crates: true
          cache-workspace-crates: true
      - uses: ./.github/actions/wasi-sdk
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
      - name: Build shared WASI guests, test binaries, and native CLI
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        run: |
          ulimit -c 0
          node scripts/wasi-build.ts --prepare .
          npm run build:shell & p_shell=$!
          CARGO_TARGET_DIR=.build/shell-wasi-tests npm run prepare:wasi-tests & p_tests=$!
          npm run build:test-guest & p_guest=$!
          npm run build:test-grep & p_grep=$!
          CARGO_TARGET_DIR=.build/shell-cli cargo build --locked --release --manifest-path shell/Cargo.toml -p shell-engine -p shell-compat-fixtures & p_cli=$!
          status=0
          for pid in "$p_shell" "$p_tests" "$p_guest" "$p_grep" "$p_cli"; do
            if ! wait "$pid"; then status=1; fi
          done
          exit "$status"
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run -W max-memory-size=268435456
      - name: Pack shared native artifacts
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        run: |
          mkdir -p .build/shell/release
          cp .build/shell-cli/release/shell-engine .build/shell-cli/release/shell-cli .build/shell/release/
          sha256sum .build/shell/release/shell-engine .build/shell/release/shell-cli > .build/shell/cli-sha256.txt
          git rev-parse HEAD > .build/shell/cli-source.txt
          npm run notices:shell
          node scripts/ci/ci-artifacts.ts pack .build/ci-native
      - name: Core dependency proof
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        run: npm run check:capabilities
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          name: native-${{ github.sha }}
          path: .build/ci-native
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || steps.paths.outputs.code == 'true'
        with:
          name: shell-cli-${{ github.sha }}
          path: |
            .build/shell/release/shell-engine
            .build/shell/release/shell-cli
            .build/shell/cli-sha256.txt
            .build/shell/cli-source.txt
          retention-days: 3
  quality:
    if: ${{ inputs.main_source == '' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select immutable layer baseline
        run: node scripts/scoreboard/scoreboard-ci.ts baseline LAYERS_BASE_REF
      - run: npm run test:check-layers && npm run check:layers && npm run typecheck:layers
        env:
          LAYERS_OUTPUT: ${{ runner.temp }}/engine-layers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-layers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-layers.json
          retention-days: 90
          if-no-files-found: error
      - run: ulimit -c 0; npm run quality:js
      - run: npm run test:ci
      - run: npm run test:guest-build
      - run: npm run typecheck:guest-build
      - run: npm run typecheck:ci
  # Downstream jobs consume prepare's JS and native artifacts directly, eliminating a hop.
  wasi:
    if: ${{ inputs.main_source == '' && needs.prepare.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
      WASI_LIBC_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-native-checks
          workspaces: shell -> ../.build/shell-checks
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: .build/wasi-libc
      - uses: actions/cache@v4
        id: machete
        with:
          path: .build/quality-tools
          key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.2
      - name: Install pinned Rust dependency checker
        if: steps.machete.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked --root .build/quality-tools
      - uses: ./.github/actions/native
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - name: WASI tests and size
        run: |
          ulimit -c 0
          npm run test:shell:wasi -- --prebuilt .build/ci-native
      - name: Run fuzz generator tests and native differential suites in parallel
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ulimit -c 0
          run_lane() {
            local name="$1"; shift
            local log="$RUNNER_TEMP/fuzz-$name.log"
            if "$@" >"$log" 2>&1; then
              echo "=== fuzz lane: $name (ok) ==="
              cat "$log"
            else
              local status=$?
              echo "=== fuzz lane: $name (FAILED: $status) ==="
              cat "$log"
              return "$status"
            fi
          }
          run_lane braces bash -euo pipefail -c '
            npm run test:fuzz-shell-braces
            npm run fuzz:shell-braces:ci -- --shell .build/shell/release/shell-cli
          ' & p1=$!
          run_lane core bash -euo pipefail -c '
            npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-cli
            npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-cli
            npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-cli
            npm run fuzz:shell-parse-boundaries:ci -- --shell .build/shell/release/shell-cli
          ' & p2=$!
          run_lane flow bash -euo pipefail -c '
            npm run test:fuzz-shell-substitutions
            npm run fuzz:shell-substitutions:ci -- --shell .build/shell/release/shell-cli
            npm run test:fuzz-shell-control-flow
            npm run fuzz:shell-control-flow:ci -- --shell .build/shell/release/shell-cli
            npm run test:fuzz-shell-job-lifetime
            npm run fuzz:shell-job-lifetime:ci -- --shell .build/shell/release/shell-cli
          ' & p3=$!
          run_lane builtins bash -euo pipefail -c '
            npm run test:fuzz-shell-functions
            npm run fuzz:shell-functions:ci -- --shell .build/shell/release/shell-cli
            npm run test:fuzz-shell-path
            npm run fuzz:shell-path:ci -- --shell .build/shell/release/shell-cli
            npm run test:fuzz-shell-printf
            npm run fuzz:shell-printf:ci -- --shell .build/shell/release/shell-cli
            npm run test:fuzz-shell-echo
            npm run fuzz:shell-echo:ci -- --shell "$GITHUB_WORKSPACE/.build/shell/release/shell-cli"
          ' & p4=$!
          status=0
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            if ! wait "$pid"; then status=1; fi
          done
          exit "$status"
      - name: Rust quality and native tests
        env:
          CARGO_TARGET_DIR: .build/shell-checks
        run: |
          ulimit -c 0
          npm run check:rust
          cargo fmt --manifest-path tests/guest/Cargo.toml --check
          cargo test --locked --manifest-path shell/Cargo.toml --workspace --no-fail-fast
          npm run test:terminal:display
  own-shell-scoreboard:
    if: ${{ inputs.main_source == '' && needs.prepare.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select compatibility baseline
        run: node scripts/scoreboard/scoreboard-ci.ts baseline BASH_COMPAT_BASE_REF
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Install isolated Bash runner tools
        run: |
          bash .github/scripts/use-main-ubuntu-archive.sh
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          # The disposable Ubuntu runner must permit bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:shell:scoreboard:prebuilt
  own-shell-observation:
    if: ${{ inputs.main_source == '' && needs.prepare.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
      actions: read
    outputs:
      current-artifact-id: ${{ steps.current-upload.outputs.artifact-id }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select compatibility baseline
        run: node scripts/scoreboard/scoreboard-ci.ts baseline BASH_COMPAT_BASE_REF
      - uses: ./.github/actions/native
      - name: Bind qualification and resolve PR main floor
        run: node scripts/scoreboard/scoreboard-ci.ts prepare "${{ runner.temp }}/scoreboard-input.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --test scripts/compat/test-diagnose-compat.ts
      - name: Observe bounded Waffle echo cases
        run: node scripts/compat/diagnose-compat.ts "${{ runner.temp }}/echo-diagnostics" -- timeout --signal=TERM --kill-after=5s 5m npm run fuzz:shell-echo:ci -- --waffle --shell "$GITHUB_WORKSPACE/.build/shell/wasm32-wasip1/release/shell-runtime.wasm"
        env:
          TMPDIR: ${{ runner.temp }}
          BASH_WEB_WAFFLE_TRACE: "1"
      - name: Observe compatibility with the shared node build
        run: node scripts/compat/diagnose-compat.ts "${{ runner.temp }}/own-shell-diagnostics" -- npm run compat:shell:prebuilt
        env:
          BASH_COMPAT_RAW: "1"
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - id: current-upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scoreboard-input.json
            ${{ runner.temp }}/own-shell-current.json
            ${{ runner.temp }}/echo-diagnostics/
            ${{ runner.temp }}/own-shell-diagnostics/
          if-no-files-found: ignore
  own-shell-compatibility:
    if: ${{ inputs.main_source == '' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    outputs:
      raw-artifact-id: ${{ steps.raw-upload.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    needs:
      - prepare
      - own-shell-scoreboard
      - own-shell-observation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.own-shell-observation.outputs.current-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - name: Seal complete raw score
        run: node scripts/scoreboard/scoreboard-ci.ts raw "${{ runner.temp }}/scoreboard-input.json" "${{ runner.temp }}/own-shell-current.json" "${{ runner.temp }}/scoreboard-raw"
      - name: Upload complete raw score
        id: raw-upload
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-raw/raw.json
          retention-days: 90
          if-no-files-found: error
  score-floor:
    if: ${{ inputs.main_source == '' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - prepare
      - own-shell-compatibility
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.own-shell-compatibility.outputs.raw-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/scoreboard-raw
      - name: Fold main floor and qualification
        run: node scripts/scoreboard/scoreboard-ci.ts fold "${{ runner.temp }}/scoreboard-raw/raw.json" "${{ runner.temp }}/scoreboard-floor"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload cumulative main floor
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-floor-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-floor/floor.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload gained and lost IDs
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-floor/qualification.json
          retention-days: 90
          if-no-files-found: error
      - name: Enforce qualification
        run: node scripts/scoreboard/scoreboard-ci.ts enforce "${{ runner.temp }}/scoreboard-floor/qualification.json"
  # Playwright uses the checked-in worker count across two shards.
  browser:
    if: ${{ inputs.main_source == '' && needs.prepare.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Use the main Ubuntu archive for browser dependencies
        run: bash .github/scripts/use-main-ubuntu-archive.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:git:browser
        if: matrix.shard == 1
      - run: npm run build:browser:assets:ci
      - run: npm run prepare:python:browser
        env:
          BASH_WEB_PYTHON_SHELL_WASM: public/programs/shell-engine.wasm
      - run: npm run test:runtime:terminal
        if: matrix.shard == 1
      - run: npm run test:ios:adapters
        if: matrix.shard == 2
      - name: Run complete Python page-host controls
        if: matrix.shard == 2
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bun scripts/browser/test-python-local.ts "$RUNNER_TEMP/python-host-chromium.json" chromium & p1=$!
          bun scripts/browser/test-python-local.ts "$RUNNER_TEMP/python-host-firefox.json" firefox & p2=$!
          status=0
          if ! wait "$p1"; then status=1; fi
          if ! wait "$p2"; then status=1; fi
          exit "$status"
      - name: Retain complete Python host results and measurements
        if: always() && matrix.shard == 2
        uses: actions/upload-artifact@v4
        with:
          name: python-host-${{ github.sha }}
          path: ${{ runner.temp }}/python-host-*.json*
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/2
        env:
          BASH_WEB_MEASURE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
  shell:
    needs:
      - main-qualification
      - prepare
      - quality
      - wasi
      - own-shell-scoreboard
      - own-shell-observation
      - own-shell-compatibility
      - score-floor
      - browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Require every check
        id: verdict
        env:
          MAIN_SOURCE: ${{ inputs.main_source }}
          MAIN_QUALIFICATION: ${{ needs.main-qualification.result }}
          CODE: ${{ needs.prepare.outputs.code }}
          PREPARE: ${{ needs.prepare.result }}
          QUALITY: ${{ needs.quality.result }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [[ -n "$MAIN_SOURCE" ]]; then
            [[ "$MAIN_QUALIFICATION" == success ]]
            echo "$RESULTS" | jq -e 'del(."main-qualification") | all(.[]; .result == "skipped")'
            exit 0
          fi
          [[ "$MAIN_QUALIFICATION" == skipped ]]
          [[ $PREPARE == success && $QUALITY == success ]]
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          echo "$RESULTS" | jq -e --arg expected "$expected" 'del(."main-qualification", .prepare, .quality) | all(.[]; .result == $expected)'

      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report the real CI verdict on the tested commit
        if: ${{ always() && inputs.main_source == '' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/waffle-updates' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULT: ${{ steps.verdict.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
            -f context="shell" -f state="$state" -f target_url="$RUN_URL" \
            -f description="Dispatched CI: $RESULT"
