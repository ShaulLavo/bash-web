name: Shell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAYERS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable layer baseline
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            baseline="$LAYERS_BASE_REF"
          else
            baseline="$(git merge-base origin/main "$GITHUB_SHA")"
          fi
          if [[ ! "$baseline" =~ ^[a-f0-9]{40}$ ]] || ! git cat-file -e "$baseline^{commit}"; then
            echo "Could not resolve immutable layer baseline: $baseline" >&2
            exit 1
          fi
          echo "LAYERS_BASE_REF=$baseline" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm run test:check-layers
      - run: npm run check:layers
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:layers
  quality:
    needs: layers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: .build/quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/quality
      - run: npm ci --ignore-scripts
      - name: Install pinned Rust dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked --root .build/quality-tools
      - run: ulimit -c 0; npm run quality

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .build/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - uses: ./.github/actions/wasi-sdk
      - run: npm ci --ignore-scripts
      - run: npm run test:guest-build
      - run: npm run typecheck:guest-build
      - run: node scripts/check-shell-parser.mjs
      - run: cargo fmt --manifest-path shell/Cargo.toml --all --check
      - name: Native shell tests
        run: ulimit -c 0; cargo test --locked --manifest-path shell/Cargo.toml --workspace -j2 --no-fail-fast
      - name: WASI shell tests and size
        run: ulimit -c 0; npm run test:shell:wasi
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run -W max-memory-size=268435456
      - name: Identify verified utility guests
        run: node scripts/utility-artifacts.ts
      - uses: actions/upload-artifact@v4
        with:
          name: utility-guests-${{ github.sha }}
          path: .build/utility-artifacts/
          if-no-files-found: error
          retention-days: 3
      - name: Core dependency proof
        run: npm run check:capabilities
      - name: Native shell CLIs
        run: >-
          cargo build --locked --release --manifest-path shell/Cargo.toml
          -p shell-engine -p shell-compat-fixtures -j2
      - name: Record native shell CLI receipts
        run: |
          sha256sum .build/shell/release/shell-engine .build/shell/release/shell-cli > .build/shell/cli-sha256.txt
          git rev-parse HEAD > .build/shell/cli-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shell-cli-${{ github.sha }}
          path: |
            .build/shell/release/shell-engine
            .build/shell/release/shell-cli
            .build/shell/cli-sha256.txt
            .build/shell/cli-source.txt
          retention-days: 3
      - run: npm run test:fuzz-shell-braces
      - run: npm run fuzz:shell-braces:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-substitutions
      - run: npm run fuzz:shell-substitutions:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-parse-boundaries:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-control-flow
      - run: npm run fuzz:shell-control-flow:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-job-lifetime
      - run: ulimit -c 0; npm run fuzz:shell-job-lifetime:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-functions
      - run: ulimit -c 0; npm run fuzz:shell-functions:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-path
      - run: ulimit -c 0; npm run fuzz:shell-path:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-printf
      - run: ulimit -c 0; npm run fuzz:shell-printf:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-echo
      - run: ulimit -c 0; npm run fuzz:shell-echo:ci -- --shell .build/shell/release/shell-cli
        env:
          TMPDIR: ${{ runner.temp }}

  own-shell-compatibility:
    needs: shell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_WEB_UTILITY_ARTIFACTS: .build/utility-artifacts
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
      BASH_COMPAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select compatibility baseline
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            baseline="$BASH_COMPAT_BASE_REF"
          else
            baseline="$(git merge-base origin/main "$GITHUB_SHA")"
          fi
          if [[ -z "$baseline" || "$baseline" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$baseline^{commit}"; then
            echo "Could not resolve compatibility baseline: $baseline" >&2
            exit 1
          fi
          echo "BASH_COMPAT_BASE_REF=$baseline" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - uses: ./.github/actions/wasi-sdk
      - run: npm ci --ignore-scripts
      - name: Install isolated Bash runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          # The disposable Ubuntu runner must permit bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:shell:scoreboard
      - uses: actions/download-artifact@v4
        with:
          name: utility-guests-${{ github.sha }}
          path: .build/utility-artifacts/
      - run: npm run build:shell
      - run: npm run fuzz:shell-echo:ci -- --waffle --shell .build/shell/wasm32-wasip1/release/shell-runtime.wasm
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run compat:shell
        env:
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current
          path: ${{ runner.temp }}/own-shell-current.json
          if-no-files-found: ignore

  browser:
    needs: shell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_WEB_UTILITY_ARTIFACTS: .build/utility-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - uses: ./.github/actions/wasi-sdk
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser:package
      - uses: actions/download-artifact@v4
        with:
          name: utility-guests-${{ github.sha }}
          path: .build/utility-artifacts/
      - run: npm run build:browser
      - run: cargo fmt --manifest-path tests/guest/Cargo.toml --check
      - run: npm run typecheck:browser
      - run: npm run format:check
      - run: npm run test:runtime:terminal
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3
