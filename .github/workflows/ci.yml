name: Shell
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.inputs.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - id: inputs
        run: node scripts/ci-inputs.ts
      - uses: actions/cache@v4
        id: packages
        with:
          path: node_modules
          key: packages-${{ runner.os }}-${{ runner.arch }}-node26.7.0-${{ steps.inputs.outputs.dependencies }}
      - if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - run: npm run sources:browser && npm run build:worker
      - name: Pack shared JavaScript inputs
        run: tar -czf "$RUNNER_TEMP/javascript.tar.gz" node_modules .sources .build/browser dist/shell-worker.js dist/fs-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-${{ github.sha }}
          path: ${{ runner.temp }}/javascript.tar.gz
          compression-level: 0
          retention-days: 1

  layers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAYERS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
      - name: Select immutable layer baseline
        run: |
          baseline="$LAYERS_BASE_REF"
          if [[ ! "$baseline" =~ ^[a-f0-9]{40}$ ]] || ! git cat-file -e "$baseline^{commit}"; then
            echo "Could not resolve immutable layer baseline: $baseline" >&2
            exit 1
          fi
          echo "LAYERS_BASE_REF=$baseline" >> "$GITHUB_ENV"
      - run: npm run test:check-layers && npm run check:layers && npm run typecheck:layers

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
      - run: ulimit -c 0; npm run quality:js
      - run: npm run test:ci
      - run: node --test scripts/test-wasi-build.ts scripts/test-verify-wasi-guests.ts

  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: .build/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: binaries
        with:
          path: .build/ci-native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.native }}
      - uses: actions/setup-node@v4
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
        if: steps.binaries.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          workspaces: |
            shell -> ../.build/shell
            tests/guest -> ../../.build/test-guest
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: .build/wasi-libc
      - uses: actions/cache@v4
        id: machete
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          path: .build/quality-tools
          key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.2
      - name: Install pinned Rust dependency checker
        if: steps.binaries.outputs.cache-hit != 'true' && steps.machete.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked --root .build/quality-tools
      - uses: ./.github/actions/wasi-sdk
        if: steps.binaries.outputs.cache-hit != 'true'
      - name: Rust quality and native tests
        if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          ulimit -c 0
          npm run check:rust
          cargo fmt --manifest-path tests/guest/Cargo.toml --check
          cargo test --locked --manifest-path shell/Cargo.toml --workspace -j2 --no-fail-fast
      - name: Build shared WASI guests and test binaries
        if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          ulimit -c 0
          npm run build:shell
          npm run build:test-guest
          npm run prepare:wasi-tests
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run -W max-memory-size=268435456
      - name: Build shared native CLI
        if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release --manifest-path shell/Cargo.toml -p shell-engine -j2
          mkdir -p .build/ci-native
          cp .build/shell/release/shell-engine .build/ci-native/
          cp .build/shell/wasm32-wasip1/release/shell-{engine,runtime}.wasm .build/ci-native/
          cp public/programs/test-{guest,spin}.wasm .build/ci-native/
          cd .build/ci-native
          echo "${{ needs.prepare.outputs.native }}" > inputs
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > cli-source.txt
          sha256sum shell-engine *.wasm wasi-tests/*.wasm inputs cli-source.txt > SHA256SUMS
      - name: Verify binary receipts
        run: |
          cd .build/ci-native
          test "$(cat inputs)" = "${{ needs.prepare.outputs.native }}"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.sha }}
          path: .build/ci-native
          retention-days: 1

  wasi:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: checked
        with:
          path: .build/wasi-checked
          key: wasi-checked-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.native }}
      - uses: actions/setup-node@v4
        if: steps.checked.outputs.cache-hit != 'true'
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
        if: steps.checked.outputs.cache-hit != 'true'
      - uses: ./.github/actions/native
        if: steps.checked.outputs.cache-hit != 'true'
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        if: steps.checked.outputs.cache-hit != 'true'
        with:
          version: v49.0.3
      - name: WASI tests and size
        if: steps.checked.outputs.cache-hit != 'true'
        run: |
          ulimit -c 0
          tests=(.build/ci-native/wasi-tests/*.wasm)
          test "${#tests[@]}" = 8
          for binary in "${tests[@]}"; do
            wasmtime run -W max-memory-size=268435456 "$binary" --test-threads=1
          done
          npm run test:shell:wasi -- --prebuilt .build/ci-native
          mkdir -p .build/wasi-checked
          echo '${{ needs.prepare.outputs.native }}' > .build/wasi-checked/inputs

  shell:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - run: npm run test:fuzz-shell-braces
      - run: npm run fuzz:shell-braces:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-engine
      - run: npm run test:fuzz-shell-substitutions
      - run: npm run fuzz:shell-substitutions:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-parse-boundaries:ci -- --shell .build/shell/release/shell-engine
      - run: npm run test:fuzz-shell-control-flow
      - run: npm run fuzz:shell-control-flow:ci -- --shell .build/shell/release/shell-engine
      - run: ulimit -c 0; npm run test:fuzz-shell-job-lifetime
      - run: ulimit -c 0; npm run fuzz:shell-job-lifetime:ci -- --shell .build/shell/release/shell-engine
      - run: ulimit -c 0; npm run test:fuzz-shell-functions
      - run: ulimit -c 0; npm run fuzz:shell-functions:ci -- --shell .build/shell/release/shell-engine
      - run: ulimit -c 0; npm run test:fuzz-shell-path
      - run: ulimit -c 0; npm run fuzz:shell-path:ci -- --shell .build/shell/release/shell-engine
      - run: ulimit -c 0; npm run test:fuzz-shell-printf
      - run: ulimit -c 0; npm run fuzz:shell-printf:ci -- --shell .build/shell/release/shell-engine

  own-shell-compatibility:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
      BASH_COMPAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select compatibility baseline
        run: |
          baseline="$BASH_COMPAT_BASE_REF"
          if [[ ! "$baseline" =~ ^[a-f0-9]{40}$ ]] || ! git cat-file -e "$baseline^{commit}"; then
            echo "Could not resolve compatibility baseline: $baseline" >&2
            exit 1
          fi
          echo "BASH_COMPAT_BASE_REF=$baseline" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - name: Install isolated Bash runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:shell:scoreboard
      - run: npm run compat:shell
        env:
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current
          path: ${{ runner.temp }}/own-shell-current.json
          if-no-files-found: ignore

  browser:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build:browser:assets
      - run: npm run test:runtime:terminal
      - run: npm run test:browser -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3
