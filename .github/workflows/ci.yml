name: Shell
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: shell-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - id: inputs
        run: node scripts/ci-inputs.ts
      - uses: actions/cache@v4
        id: downloads
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node26.12.1-${{ steps.inputs.outputs.dependencies }}
          restore-keys: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node26.12.1-
      - uses: actions/cache@v4
        id: packages
        with:
          path: node_modules
          key: packages-${{ runner.os }}-${{ runner.arch }}-node26.12.1-${{ steps.inputs.outputs.dependencies }}
      - if: steps.packages.outputs.cache-hit != 'true' || steps.downloads.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - run: npm run sources:browser && npm run build:worker && npm run build:node-harness
      - name: Pack shared JavaScript inputs
        run: tar -czf "$RUNNER_TEMP/javascript.tar.gz" node_modules .sources .build/browser .build/node dist/shell-worker.js dist/fs-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-${{ github.sha }}
          path: ${{ runner.temp }}/javascript.tar.gz
          compression-level: 0
          retention-days: 1
  layers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select immutable layer baseline
        run: node scripts/scoreboard-ci.mjs baseline LAYERS_BASE_REF
      - run: npm run test:check-layers && npm run check:layers && npm run typecheck:layers
        env:
          LAYERS_OUTPUT: ${{ runner.temp }}/engine-layers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-layers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-layers.json
          retention-days: 90
          if-no-files-found: error
  quality:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - run: ulimit -c 0; npm run quality:js
      - run: npm run test:ci
      - run: npm run test:guest-build
      - run: npm run typecheck:guest-build
      - run: npm run typecheck:ci
  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: .build/shell
      WASI_LIBC_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shell -> ../.build/shell
            tests/guest -> ../../.build/test-guest
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: .build/wasi-libc
      - uses: actions/cache@v4
        id: machete
        with:
          path: .build/quality-tools
          key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.2
      - name: Install pinned Rust dependency checker
        if: steps.machete.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked --root .build/quality-tools -j2
      - uses: ./.github/actions/wasi-sdk
      - name: Rust quality and native tests
        run: |
          ulimit -c 0
          npm run check:rust
          cargo fmt --manifest-path tests/guest/Cargo.toml --check
          cargo test --locked --manifest-path shell/Cargo.toml --workspace -j2 --no-fail-fast
      - name: Build shared WASI guests and test binaries
        run: |
          ulimit -c 0
          npm run build:shell
          npm run build:test-guest
          npm run prepare:wasi-tests
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run -W max-memory-size=268435456
      - uses: actions/cache@v4
        with:
          path: |
            .sources/ripgrep
            .build/ripgrep
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-sdk34-${{ hashFiles('scripts/build-rg.ts', 'scripts/rg-source.ts', 'scripts/wasi-build.ts', 'patches/ripgrep-wasi.patch') }}
      - name: Build upstream ripgrep once for WASI and browser checks
        run: npm run build:rg
      - uses: actions/upload-artifact@v4
        with:
          name: ripgrep-${{ github.sha }}
          path: |
            dist/rg.wasm
            dist/rg.NOTICES.txt
          if-no-files-found: error
          retention-days: 1
      - name: Build shared native CLI
        run: |
          cargo build --locked --release --manifest-path shell/Cargo.toml -p shell-engine -p shell-compat-fixtures -j2
          sha256sum .build/shell/release/shell-engine .build/shell/release/shell-cli > .build/shell/cli-sha256.txt
          git rev-parse HEAD > .build/shell/cli-source.txt
          node scripts/utility-artifacts.ts
          npm run notices:shell
          node scripts/ci-artifacts.ts pack .build/ci-native
      - name: Core dependency proof
        run: npm run check:capabilities
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.sha }}
          path: .build/ci-native
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: utility-guests-${{ github.sha }}
          path: .build/utility-artifacts/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: shell-cli-${{ github.sha }}
          path: |
            .build/shell/release/shell-engine
            .build/shell/release/shell-cli
            .build/shell/cli-sha256.txt
            .build/shell/cli-source.txt
          retention-days: 3
  python:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/wasi-sdk
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - id: python-inputs
        run: node scripts/python-ci.ts
      - uses: actions/cache@v4
        id: python-assets
        with:
          path: .build/python-assets
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-inputs.outputs.key }}
      - name: Build and qualify Python once
        if: steps.python-assets.outputs.cache-hit != 'true'
        run: npm run build:python -- --output .build/python-assets
      - name: Validate Python assets before distribution
        run: npm run build:python -- --stage .build/python-assets --output .build/python-distribution
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ github.sha }}
          path: .build/python-distribution
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  wasi:
    needs:
      - prepare
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - uses: actions/download-artifact@v4
        with:
          name: ripgrep-${{ github.sha }}
          path: dist
      - run: npm run test:rg:wasi
      - name: WASI tests and size
        run: |
          ulimit -c 0
          npm run test:shell:wasi -- --prebuilt .build/ci-native
  fuzz:
    needs:
      - prepare
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - run: npm run test:fuzz-shell-braces
      - run: npm run fuzz:shell-braces:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-substitutions
      - run: npm run fuzz:shell-substitutions:ci -- --shell .build/shell/release/shell-cli
      - run: npm run fuzz:shell-parse-boundaries:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-control-flow
      - run: npm run fuzz:shell-control-flow:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-job-lifetime
      - run: ulimit -c 0; npm run fuzz:shell-job-lifetime:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-functions
      - run: ulimit -c 0; npm run fuzz:shell-functions:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-path
      - run: ulimit -c 0; npm run fuzz:shell-path:ci -- --shell .build/shell/release/shell-cli
      - run: ulimit -c 0; npm run test:fuzz-shell-printf
      - run: ulimit -c 0; npm run fuzz:shell-printf:ci -- --shell .build/shell/release/shell-cli
      - run: npm run test:fuzz-shell-echo
      - run: ulimit -c 0; npm run fuzz:shell-echo:ci -- --shell "$GITHUB_WORKSPACE/.build/shell/release/shell-cli"
        env:
          TMPDIR: ${{ runner.temp }}
  own-shell-scoreboard:
    needs:
      - prepare
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_WEB_UTILITY_ARTIFACTS: .build/utility-artifacts
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select compatibility baseline
        run: node scripts/scoreboard-ci.mjs baseline BASH_COMPAT_BASE_REF
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-wasip1-rustfmt-clippy
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Install isolated Bash runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          # The disposable Ubuntu runner must permit bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:shell:scoreboard:prebuilt
  own-shell-observation:
    permissions:
      contents: read
      actions: read
    outputs:
      current-artifact-id: ${{ steps.current-upload.outputs.artifact-id }}
    needs:
      - prepare
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_WEB_UTILITY_ARTIFACTS: .build/utility-artifacts
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - name: Select compatibility baseline
        run: node scripts/scoreboard-ci.mjs baseline BASH_COMPAT_BASE_REF
      - uses: ./.github/actions/native
      - name: Bind qualification and resolve PR main floor
        run: node scripts/scoreboard-ci.mjs prepare "${{ runner.temp }}/scoreboard-input.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --test scripts/test-diagnose-compat.ts
      - run: npm run fuzz:shell-echo:ci -- --waffle --shell "$GITHUB_WORKSPACE/.build/shell/wasm32-wasip1/release/shell-runtime.wasm"
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Observe compatibility with the shared node build
        run: node scripts/diagnose-compat.ts "${{ runner.temp }}/own-shell-diagnostics" -- npm run compat:shell:prebuilt
        env:
          BASH_COMPAT_RAW: "1"
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - id: current-upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scoreboard-input.json
            ${{ runner.temp }}/own-shell-current.json
            ${{ runner.temp }}/own-shell-diagnostics/
          if-no-files-found: ignore
  own-shell-compatibility:
    outputs:
      raw-artifact-id: ${{ steps.raw-upload.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    needs:
      - prepare
      - own-shell-scoreboard
      - own-shell-observation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.own-shell-observation.outputs.current-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - name: Seal complete raw score
        run: node scripts/scoreboard-ci.mjs raw "${{ runner.temp }}/scoreboard-input.json" "${{ runner.temp }}/own-shell-current.json" "${{ runner.temp }}/scoreboard-raw"
      - name: Upload complete raw score
        id: raw-upload
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-raw/raw.json
          retention-days: 90
          if-no-files-found: error
  score-floor:
    needs:
      - prepare
      - own-shell-compatibility
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: ./.github/actions/javascript
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.own-shell-compatibility.outputs.raw-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/scoreboard-raw
      - name: Fold main floor and qualification
        run: node scripts/scoreboard-ci.mjs fold "${{ runner.temp }}/scoreboard-raw/raw.json" "${{ runner.temp }}/scoreboard-floor"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload cumulative main floor
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-floor-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-floor/floor.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload gained and lost IDs
        uses: actions/upload-artifact@v4
        with:
          name: own-shell-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-floor/qualification.json
          retention-days: 90
          if-no-files-found: error
      - name: Enforce qualification
        run: node scripts/scoreboard-ci.mjs enforce "${{ runner.temp }}/scoreboard-floor/qualification.json"
  browser:
    needs:
      - prepare
      - native
      - python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/javascript
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium firefox
      - uses: actions/download-artifact@v4
        with:
          name: ripgrep-${{ github.sha }}
          path: public/programs
      - run: cp public/programs/rg.wasm dist/rg.wasm
      - run: npm run build:browser:assets:ci
      - uses: actions/download-artifact@v4
        with:
          name: python-${{ github.sha }}
          path: .build/python-assets
      - run: npm run build:python -- --stage .build/python-assets --output dist
      - run: npm run prepare:python:browser
        env:
          BASH_WEB_PYTHON_SHELL_WASM: public/programs/shell-engine.wasm
      - run: npm run test:runtime:terminal
      - run: npm run test:installed-sed
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3
  shell:
    needs:
      - prepare
      - layers
      - quality
      - native
      - python
      - wasi
      - fuzz
      - own-shell-scoreboard
      - own-shell-observation
      - own-shell-compatibility
      - score-floor
      - browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" != 'success' ]]; then
              exit 1
            fi
          done
