name: Shell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .build/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - run: npm ci
      - run: node scripts/check-shell-parser.mjs
      - run: cargo fmt --manifest-path shell/Cargo.toml --all --check
      - name: Native shell tests
        run: cargo test --locked --manifest-path shell/Cargo.toml --workspace -j2 --no-fail-fast
      - name: WASI shell tests and size
        run: npm run test:shell:wasi
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run -W max-memory-size=268435456
      - name: Native shell CLI
        run: cargo build --locked --release --manifest-path shell/Cargo.toml -p shell-engine -j2
      - name: Record native shell CLI receipts
        run: |
          sha256sum .build/shell/release/shell-engine > .build/shell/cli-sha256.txt
          git rev-parse HEAD > .build/shell/cli-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shell-cli-${{ github.sha }}
          path: |
            .build/shell/release/shell-engine
            .build/shell/cli-sha256.txt
            .build/shell/cli-source.txt
          retention-days: 3
      - run: npm run test:fuzz-shell-braces
      - run: npm run fuzz:shell-braces:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-engine
      - run: npm run test:fuzz-shell-substitutions
      - run: npm run fuzz:shell-substitutions:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-parse-boundaries:ci -- --shell .build/shell/release/shell-engine

  own-shell-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
      BASH_COMPAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - run: npm ci
      - name: Install isolated Bash runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          # The disposable Ubuntu runner must permit bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm run test:shell:scoreboard
      - run: npm run build:shell
      - run: npm run compat:shell
        env:
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current
          path: ${{ runner.temp }}/own-shell-current.json
          if-no-files-found: ignore
